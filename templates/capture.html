<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skin Tracking Capture</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; text-align: center; color: #222; }
  video, canvas { width: 100%; border-radius: 8px; background: #000; }
  canvas { display: none; }
  .controls { margin-top: 16px; display: flex; gap: 12px; justify-content: center; }
  button { padding: 10px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #2c6e49; color: #fff; border-color: #2c6e49; }
  #error { color: #c0392b; margin-top: 12px; font-size: 14px; }
  #results { margin-top: 28px; text-align: left; }
  .overall { font-size: 20px; margin-bottom: 16px; }
  .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
  .zone-card img { display: block; width: 100%; height: 160px; object-fit: cover; }
  .zone-card .zone-info { padding: 8px 10px; }
  .zone-name { font-weight: 600; text-transform: capitalize; }
  .zone-detail { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>Skin Tracking Capture</h1>
  <p id="prompt">Position yourself: we'll take three photos — left profile, right profile, then front.</p>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
    <div><strong>Step:</strong> <span id="stepLabel">Left profile</span></div>
    <div id="thumbs" style="display:flex; gap:8px; align-items:center;"></div>
  </div>

  <div class="controls">
    <button id="captureBtn" class="primary">Capture</button>
  </div>

  <div id="error"></div>
  <div id="results"></div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('captureBtn');
const results = document.getElementById('results');
const errorDiv = document.getElementById('error');

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  video.srcObject = stream;
}
startCamera().catch(err => {
  errorDiv.textContent = 'Camera error: ' + err.message;
});
let step = 0; // 0: left, 1: right, 2: front
const stepNames = ['Left profile', 'Right profile', 'Front'];
const thumbs = document.getElementById('thumbs');
const stepLabel = document.getElementById('stepLabel');
const captures = [null, null, null];

function updateUI() {
  stepLabel.textContent = stepNames[step];
  // update thumbnails
  thumbs.innerHTML = '';
  for (let i = 0; i < captures.length; i++) {
    const img = document.createElement('img');
    img.style.width = '72px';
    img.style.height = '72px';
    img.style.objectFit = 'cover';
    img.style.borderRadius = '6px';
    img.style.border = i === step ? '2px solid #2c6e49' : '1px solid #ddd';
    img.alt = stepNames[i];
    img.src = captures[i] || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="100%" height="100%" fill="%23f5f5f5"/></svg>';
    thumbs.appendChild(img);
  }
}

updateUI();

captureBtn.addEventListener('click', async () => {
  errorDiv.textContent = '';
  results.innerHTML = '';

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

  // store thumbnail for this step
  captures[step] = dataUrl;
  updateUI();

  // if not the final (front) image, advance to next step and prompt user
  if (step < 2) {
    step += 1;
    captureBtn.textContent = 'Capture';
    return;
  }

  // final step: submit all three images for analysis
  captureBtn.disabled = true;
  captureBtn.textContent = 'Analyzing...';

  try {
    const resp = await fetch('/api/skin-capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        images: { left: captures[0], right: captures[1], front: captures[2] },
      }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || 'Request failed');
    }
    renderResults(data);
  } catch (err) {
    errorDiv.textContent = err.message;
  } finally {
    captureBtn.disabled = false;
    captureBtn.textContent = 'Capture again';
    // reset for another capture sequence
    step = 0;
    captures.fill(null);
    updateUI();
  }
});

function renderResults(data) {
  let html = `<div class="overall">Overall severity: <strong>${data.scores.overall}</strong></div>`;
  html += '<div class="zone-grid">';
  for (const zoneName of Object.keys(data.zones)) {
    const score = data.scores[zoneName];
    html += `
      <div class="zone-card">
        <img src="${data.zones[zoneName]}" alt="${zoneName}">
        <div class="zone-info">
          <div class="zone-name">${zoneName.replace('_', ' ')}</div>
          <div class="zone-detail">${score.label} · confidence ${score.confidence} · severity ${score.severity_score}</div>
        </div>
      </div>
    `;
  }
  html += '</div>';
  results.innerHTML = html;
}
</script>
</body>
</html>
