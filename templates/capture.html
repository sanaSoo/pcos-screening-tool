<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skin Tracking Capture</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; text-align: center; color: #222; }
  video, canvas { width: 100%; border-radius: 8px; background: #000; }
  canvas { display: none; }
  .controls { margin-top: 16px; display: flex; gap: 12px; justify-content: center; }
  button { padding: 10px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #2c6e49; color: #fff; border-color: #2c6e49; }
  #error { color: #c0392b; margin-top: 12px; font-size: 14px; }
  #results { margin-top: 28px; text-align: left; }
  .overall { font-size: 20px; margin-bottom: 16px; }
  .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .zone-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
  .zone-card img { display: block; width: 100%; height: 160px; object-fit: cover; }
  .zone-card .zone-info { padding: 8px 10px; }
  .zone-name { font-weight: 600; text-transform: capitalize; }
  .zone-detail { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>Skin Tracking Capture</h1>
  <p>Line yourself up in frame, then click Capture.</p>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="captureBtn" class="primary">Capture</button>
  </div>

  <div id="error"></div>
  <div id="results"></div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('captureBtn');
const results = document.getElementById('results');
const errorDiv = document.getElementById('error');

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  video.srcObject = stream;
}
startCamera().catch(err => {
  errorDiv.textContent = 'Camera error: ' + err.message;
});

captureBtn.addEventListener('click', async () => {
  errorDiv.textContent = '';
  results.innerHTML = '';

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

  captureBtn.disabled = true;
  captureBtn.textContent = 'Analyzing...';

  try {
    const resp = await fetch('/api/skin-capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || 'Request failed');
    }
    renderResults(data);
  } catch (err) {
    errorDiv.textContent = err.message;
  } finally {
    captureBtn.disabled = false;
    captureBtn.textContent = 'Capture again';
  }
});

function renderResults(data) {
  let html = `<div class="overall">Overall severity: <strong>${data.scores.overall}</strong></div>`;
  html += '<div class="zone-grid">';
  for (const zoneName of Object.keys(data.zones)) {
    const score = data.scores[zoneName];
    html += `
      <div class="zone-card">
        <img src="${data.zones[zoneName]}" alt="${zoneName}">
        <div class="zone-info">
          <div class="zone-name">${zoneName.replace('_', ' ')}</div>
          <div class="zone-detail">${score.label} · confidence ${score.confidence} · severity ${score.severity_score}</div>
        </div>
      </div>
    `;
  }
  html += '</div>';
  results.innerHTML = html;
}
</script>
</body>
</html>
